<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#071222">
	<title>ROYAL 2048 WEB</title>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<style>
		:root { color-scheme: dark; --stage-width: 100vw; --stage-height: 100dvh; }
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body {
			background: #071222;
			font-family: Georgia, 'Times New Roman', serif;
			overscroll-behavior: none;
		}
		#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
		#game-stage {
			position: relative; width: var(--stage-width); height: var(--stage-height);
			background: #080f1a; isolation: isolate;
		}
		#canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: none; }
		#status {
			position: absolute; inset: 0; display: grid; align-content: center;
			justify-items: center; gap: 22px; padding: 28px;
			background: radial-gradient(ellipse at 50% 30%, #193451, #080f1c 80%);
			color: #ecdaac; text-align: center; z-index: 2;
		}
		#status[hidden] { display: none; }
		.loading-crown { width: 70px; height: 52px; color: #ccaf6a; }
		#status-label { margin: 0; font-size: clamp(18px, 4vw, 23px); letter-spacing: .16em; }
		#status-progress {
			appearance: none; width: min(78%, 250px); height: 7px; border: 0;
			border-radius: 8px; overflow: hidden; background: #020917; accent-color: #c3a66a;
		}
		#status-progress::-webkit-progress-bar { background: #020917; border-radius: 8px; }
		#status-progress::-webkit-progress-value { background: linear-gradient(90deg, #97733b, #f1d997); border-radius: 8px; }
		#status-progress::-moz-progress-bar { background: #c3a66a; border-radius: 8px; }
		#status-notice { margin: 0; font: 14px/1.6 system-ui, sans-serif; color: #c2ccda; overflow-wrap: anywhere; }
		#retry { padding: 11px 28px; color: #f7e6be; border: 1px solid #b99a5c; border-radius: 8px; background: #19314d; cursor: pointer; }
		noscript { position: fixed; inset: 30% 15%; color: #eee0bb; z-index: 10; text-align: center; }
	</style>
</head>
<body>
	<main id="viewport">
		<div id="game-stage">
			<canvas id="canvas" width="750" height="1334" tabindex="0" aria-label="ROYAL 2048 game">Your browser does not support canvas.</canvas>
			<div id="status" role="status" aria-live="polite">
				<svg class="loading-crown" viewBox="0 0 80 60" fill="none" aria-hidden="true"><path d="m8 16 16 9L40 5l16 20 16-9-7 34H15ZM17 56h46" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m40 23 6 9-6 9-6-9Z" fill="currentColor"/></svg>
				<p id="status-label">ROYAL 2048</p>
				<progress id="status-progress" aria-label="Loading game"></progress>
				<p id="status-notice">Loading your kingdom…</p>
				<button id="retry" hidden>Try again</button>
			</div>
		</div>
	</main>
	<noscript>Please enable JavaScript to play ROYAL 2048.</noscript>
	<script src="index.js"></script>
	<script>
	'use strict';
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":37372412,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const GODOT_THREADS_ENABLED = false;
	const canvas = document.getElementById('canvas');
	const status = document.getElementById('status');
	const progress = document.getElementById('status-progress');
	const notice = document.getElementById('status-notice');
	const retry = document.getElementById('retry');
	function fitGame() {
		const width = document.documentElement.clientWidth;
		const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
		const gameHeight = height;
		const gameWidth = width;
		document.documentElement.style.setProperty('--stage-width', `${gameWidth}px`);
		document.documentElement.style.setProperty('--stage-height', `${gameHeight}px`);
		// Match the embed at Retina density. Godot owns the responsive game UI.
		const density = Math.min(window.devicePixelRatio || 1, 2);
		const bufferWidth = Math.max(1, Math.round(gameWidth * density));
		const bufferHeight = Math.max(1, Math.round(gameHeight * density));
		if (canvas.width !== bufferWidth) canvas.width = bufferWidth;
		if (canvas.height !== bufferHeight) canvas.height = bufferHeight;
	}
	fitGame();
	window.addEventListener('resize', fitGame);
	window.visualViewport?.addEventListener('resize', fitGame);
	document.addEventListener('fullscreenchange', fitGame);
	// Re-evaluate Retina density when moving the window between displays.
	let densityQuery;
	function watchDensity() {
		densityQuery?.removeEventListener('change', watchDensity);
		densityQuery = matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`);
		densityQuery.addEventListener('change', watchDensity, {once: true});
		fitGame();
	}
	watchDensity();
	retry.addEventListener('click', () => window.location.reload());
	function showFailure(error) {
		console.error(error);
		status.hidden = false;
		progress.hidden = true;
		notice.textContent = `The game could not start. ${error instanceof Error ? error.message : String(error)}`;
		retry.hidden = false;
	}
	if (typeof Engine === 'undefined') {
		showFailure('Please check your connection and try again.');
	} else {
		const engine = new Engine(GODOT_CONFIG);
		const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
		if (missing.length) {
			showFailure(`Your browser needs: ${missing.join(', ')}.`);
		} else {
			engine.startGame({
				canvas, canvasResizePolicy: 0,
				onProgress(current, total) {
					if (total > 0) { progress.max = total; progress.value = current; }
					else progress.removeAttribute('value');
				},
			}).then(() => { fitGame(); status.hidden = true; }).catch(showFailure);
		}
	}
	</script>
</body>
</html>
